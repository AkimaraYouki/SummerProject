[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open_duck_mini_isaaclab"
version = "0.1.0"
description = "Isaac Lab training pipeline for the Open Duck Mini V2 biped (port of Open_Duck_Playground's MJX joystick task)."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "gymnasium",
    # isaaclab / isaacsim are NOT listed here: they are expected to be
    # provided by a separately installed IsaacLab checkout on the training
    # machine (see README.md). Declaring them here would make this package
    # unable to `pip install` on machines without Isaac Sim (e.g. this Mac,
    # for authoring/reviewing code and running the CPU-only unit tests).
]

[project.optional-dependencies]
# only needed to run scripts/generate_reference_motion.sh
# placo MUST be pinned to 0.6.3 — reference_motion_generator/pyproject.toml
# pins the same version and its vendored code (placo_walk_engine.py) calls
# HumanoidParameters.replan_timesteps, an attribute that no longer exists on
# newer placo (confirmed broken on 0.9.23, 2026-07-26). Also note: 0.6.3 has
# no macOS wheel on PyPI (Linux-only prebuilt), so this extra is effectively
# Ubuntu-only despite generate_reference_motion.sh's "Mac-runnable" comment —
# building 0.6.3 from source on Mac was not attempted (real risk, not worth
# it when the lab PC just works).
reference-motion = ["placo==0.6.3", "scipy"]
# only needed to run scripts/mujoco_infer.py
sim2real-check = ["mujoco", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["source"]
