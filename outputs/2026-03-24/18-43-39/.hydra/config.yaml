env:
  viewer:
    eye:
    - 7.5
    - 7.5
    - 7.5
    lookat:
    - 0.0
    - 0.0
    - 0.0
    cam_prim_path: /OmniverseKit_Persp
    resolution:
    - 1280
    - 720
    origin_type: world
    env_index: 0
    asset_name: null
    body_name: null
  sim:
    physics_prim_path: /physicsScene
    device: cuda:0
    dt: 0.008333333333333333
    render_interval: 1
    gravity:
    - 0.0
    - 0.0
    - -9.81
    enable_scene_query_support: false
    use_fabric: true
    physx:
      solver_type: 1
      solve_articulation_contact_last: false
      min_position_iteration_count: 1
      max_position_iteration_count: 255
      min_velocity_iteration_count: 0
      max_velocity_iteration_count: 255
      enable_ccd: false
      enable_stabilization: false
      enable_external_forces_every_iteration: false
      enable_enhanced_determinism: false
      bounce_threshold_velocity: 0.5
      friction_offset_threshold: 0.04
      friction_correlation_distance: 0.025
      gpu_max_rigid_contact_count: 8388608
      gpu_max_rigid_patch_count: 163840
      gpu_found_lost_pairs_capacity: 2097152
      gpu_found_lost_aggregate_pairs_capacity: 33554432
      gpu_total_aggregate_pairs_capacity: 2097152
      gpu_collision_stack_size: 67108864
      gpu_heap_capacity: 67108864
      gpu_temp_buffer_capacity: 16777216
      gpu_max_num_partitions: 8
      gpu_max_soft_body_contacts: 1048576
      gpu_max_particle_contacts: 1048576
    physics_material:
      func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
      static_friction: 0.5
      dynamic_friction: 0.5
      restitution: 0.0
      friction_combine_mode: average
      restitution_combine_mode: average
      compliant_contact_stiffness: 0.0
      compliant_contact_damping: 0.0
    render:
      enable_translucency: null
      enable_reflections: null
      enable_global_illumination: null
      antialiasing_mode: null
      enable_dlssg: null
      enable_dl_denoiser: null
      dlss_mode: null
      enable_direct_lighting: null
      samples_per_pixel: null
      enable_shadows: null
      enable_ambient_occlusion: null
      dome_light_upper_lower_strategy: null
      carb_settings: null
      rendering_mode: null
    create_stage_in_memory: false
    logging_level: WARNING
    save_logs_to_file: true
    log_dir: null
  ui_window_class_type: isaaclab.envs.ui.manager_based_rl_env_window:ManagerBasedRLEnvWindow
  seed: null
  decimation: 2
  scene:
    num_envs: 512
    env_spacing: 3.0
    lazy_sensor_update: true
    replicate_physics: true
    filter_collisions: true
    clone_in_fabric: false
    robot:
      class_type: isaaclab.assets.articulation.articulation:Articulation
      prim_path: '{ENV_REGEX_NS}/Robot'
      spawn:
        func: isaaclab.sim.spawners.from_files.from_files:spawn_from_usd
        visible: true
        semantic_tags: null
        copy_from_source: true
        mass_props: null
        deformable_props: null
        rigid_props:
          rigid_body_enabled: null
          kinematic_enabled: null
          disable_gravity: false
          linear_damping: null
          angular_damping: null
          max_linear_velocity: null
          max_angular_velocity: null
          max_depenetration_velocity: 5.0
          max_contact_impulse: null
          enable_gyroscopic_forces: null
          retain_accelerations: null
          solver_position_iteration_count: null
          solver_velocity_iteration_count: null
          sleep_threshold: null
          stabilization_threshold: null
        collision_props: null
        activate_contact_sensors: true
        scale: null
        articulation_props:
          articulation_enabled: null
          enabled_self_collisions: false
          solver_position_iteration_count: 64
          solver_velocity_iteration_count: 8
          sleep_threshold: null
          stabilization_threshold: null
          fix_root_link: null
        fixed_tendons_props: null
        spatial_tendons_props: null
        joint_drive_props: null
        visual_material_path: material
        visual_material: null
        usd_path: /home/wonwoo/Desktop/bdx.usd
        variants: null
      init_state:
        pos:
        - 0.0
        - 0.0
        - 1.0
        rot:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        lin_vel:
        - 0.0
        - 0.0
        - 0.0
        ang_vel:
        - 0.0
        - 0.0
        - 0.0
        joint_pos:
          left_hip_yaw: 0.0
          left_hip_roll: 0.0
          left_hip_pitch: -0.3
          left_knee: 0.6
          left_ankle: -0.3
          right_hip_yaw: 0.0
          right_hip_roll: 0.0
          right_hip_pitch: -0.3
          right_knee: 0.6
          right_ankle: -0.3
          neck_pitch: 0.0
          head_pitch: 0.0
          head_yaw: 0.0
          head_roll: 0.0
          left_antenna: 0.0
          right_antenna: 0.0
        joint_vel:
          .*: 0.0
      collision_group: 0
      debug_vis: false
      articulation_root_prim_path: null
      soft_joint_pos_limit_factor: 1.0
      actuators:
        left_leg:
          class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
          joint_names_expr:
          - left_hip_yaw
          - left_hip_roll
          - left_hip_pitch
          - left_knee
          - left_ankle
          effort_limit: 80.0
          velocity_limit: null
          effort_limit_sim: null
          velocity_limit_sim: null
          stiffness: 100.0
          damping: 20.0
          armature: 0.05
          friction: null
          dynamic_friction: null
          viscous_friction: null
        right_leg:
          class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
          joint_names_expr:
          - right_hip_yaw
          - right_hip_roll
          - right_hip_pitch
          - right_knee
          - right_ankle
          effort_limit: 80.0
          velocity_limit: null
          effort_limit_sim: null
          velocity_limit_sim: null
          stiffness: 100.0
          damping: 20.0
          armature: 0.05
          friction: null
          dynamic_friction: null
          viscous_friction: null
        head:
          class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
          joint_names_expr:
          - neck_pitch
          - head_.*
          effort_limit: 20.0
          velocity_limit: null
          effort_limit_sim: null
          velocity_limit_sim: null
          stiffness: 40.0
          damping: 8.0
          armature: null
          friction: null
          dynamic_friction: null
          viscous_friction: null
        antenna:
          class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
          joint_names_expr:
          - left_antenna
          - right_antenna
          effort_limit: 5.0
          velocity_limit: null
          effort_limit_sim: null
          velocity_limit_sim: null
          stiffness: 5.0
          damping: 1.0
          armature: null
          friction: null
          dynamic_friction: null
          viscous_friction: null
      actuator_value_resolution_debug_print: false
    terrain:
      class_type: isaaclab.terrains.terrain_importer:TerrainImporter
      collision_group: -1
      prim_path: /World/ground
      num_envs: 1
      terrain_type: plane
      terrain_generator: null
      usd_path: null
      env_spacing: null
      use_terrain_origins: true
      visual_material:
        func: isaaclab.sim.spawners.materials.visual_materials:spawn_preview_surface
        diffuse_color:
        - 0.0
        - 0.0
        - 0.0
        emissive_color:
        - 0.0
        - 0.0
        - 0.0
        roughness: 0.5
        metallic: 0.0
        opacity: 1.0
      physics_material:
        func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
        static_friction: 1.0
        dynamic_friction: 1.0
        restitution: 0.0
        friction_combine_mode: average
        restitution_combine_mode: average
        compliant_contact_stiffness: 0.0
        compliant_contact_damping: 0.0
      max_init_terrain_level: null
      debug_vis: false
  recorders:
    dataset_file_handler_class_type: isaaclab.utils.datasets.hdf5_dataset_file_handler:HDF5DatasetFileHandler
    dataset_export_dir_path: /tmp/isaaclab/logs
    dataset_filename: dataset
    dataset_export_mode:
      _value_: 1
      _name_: EXPORT_ALL
    export_in_record_pre_reset: true
    export_in_close: false
  observations:
    policy:
      concatenate_terms: true
      concatenate_dim: -1
      enable_corruption: false
      history_length: null
      flatten_history_dim: true
      base_height:
        func: isaaclab.envs.mdp.observations:base_pos_z
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      base_lin_vel:
        func: isaaclab.envs.mdp.observations:base_lin_vel
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      base_ang_vel:
        func: isaaclab.envs.mdp.observations:base_ang_vel
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      joint_pos:
        func: isaaclab.envs.mdp.observations:joint_pos_rel
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      joint_vel:
        func: isaaclab.envs.mdp.observations:joint_vel_rel
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      projected_gravity:
        func: isaaclab.envs.mdp.observations:projected_gravity
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      actions:
        func: isaaclab.envs.mdp.observations:last_action
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
  actions:
    joint_effort:
      class_type: isaaclab.envs.mdp.actions.joint_actions:JointEffortAction
      asset_name: robot
      debug_vis: false
      clip: null
      joint_names:
      - left_hip_pitch
      - left_knee
      - left_ankle
      - right_hip_pitch
      - right_knee
      - right_ankle
      scale: 8.0
      offset: 0.0
      preserve_order: false
  events:
    reset_base:
      func: isaaclab.envs.mdp.events:reset_root_state_uniform
      params:
        pose_range: {}
        velocity_range: {}
      mode: reset
      interval_range_s: null
      is_global_time: false
      min_step_count_between_reset: 0
    reset_robot_joints:
      func: isaaclab.envs.mdp.events:reset_joints_by_offset
      params:
        asset_cfg:
          name: robot
          joint_names: null
          joint_ids: slice(None,None,None)
          fixed_tendon_names: null
          fixed_tendon_ids: slice(None,None,None)
          body_names: null
          body_ids: slice(None,None,None)
          object_collection_names: null
          object_collection_ids: slice(None,None,None)
          preserve_order: false
        position_range:
        - 0.0
        - 0.0
        velocity_range:
        - 0.0
        - 0.0
      mode: reset
      interval_range_s: null
      is_global_time: false
      min_step_count_between_reset: 0
  rerender_on_reset: false
  num_rerenders_on_reset: 0
  wait_for_textures: true
  xr: null
  teleop_devices:
    devices: {}
  export_io_descriptors: false
  log_dir: null
  is_finite_horizon: false
  episode_length_s: 10.0
  rewards:
    progress:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:progress_reward
      params:
        target_pos:
        - 1000.0
        - 0.0
        - 0.0
      weight: 3.0
    alive:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:is_alive
      params: {}
      weight: 1.0
    height:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:base_height_reward
      params:
        target_height: 0.55
      weight: 1.0
    lateral:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:lateral_penalty
      params: {}
      weight: -0.5
    action_l2:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:action_l2
      params: {}
      weight: -0.01
    joint_vel:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:joint_vel_penalty
      params: {}
      weight: -0.001
    air_kick:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:air_kick_penalty
      params: {}
      weight: -0.1
    terminate:
      func: BDX.tasks.manager_based.bdx.mdp.rewards:terminate_penalty
      params: {}
      weight: -5.0
  terminations:
    time_out:
      func: isaaclab.envs.mdp.terminations:time_out
      params: {}
      time_out: true
    bad_orientation:
      func: isaaclab.envs.mdp.terminations:bad_orientation
      params:
        limit_angle: 0.7
      time_out: false
  curriculum: null
  commands: null
agent:
  seed: 42
  models:
    separate: false
    policy:
      class: GaussianMixin
      clip_actions: false
      clip_log_std: true
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: 0.0
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 128
        - 64
        activations: elu
      output: ACTIONS
    value:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 128
        - 64
        activations: elu
      output: ONE
  memory:
    class: RandomMemory
    memory_size: -1
  agent:
    class: PPO
    rollouts: 1
    learning_epochs: 5
    mini_batches: 4
    discount_factor: 0.99
    lambda: 0.95
    learning_rate: 0.0003
    learning_rate_scheduler: KLAdaptiveLR
    learning_rate_scheduler_kwargs:
      kl_threshold: 0.008
    state_preprocessor: RunningStandardScaler
    state_preprocessor_kwargs: null
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: null
    random_timesteps: 200000
    learning_starts: 0
    grad_norm_clip: 1.0
    ratio_clip: 0.2
    value_clip: 0.2
    clip_predicted_values: true
    entropy_loss_scale: 0.01
    value_loss_scale: 2.0
    kl_threshold: 0.0
    rewards_shaper_scale: 0.01
    time_limit_bootstrap: true
    experiment:
      directory: bdx_walking
      experiment_name: ''
      write_interval: auto
      checkpoint_interval: auto
  trainer:
    class: SequentialTrainer
    timesteps: 200000
    environment_info: log
